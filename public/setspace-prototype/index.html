place Space", "svg": "svg/flow-journal-article.svg", "markup": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"1740\" viewBox=\"0 0 1440 1740\" style=\"display:block;width:100%;height:100%\"><g transform=\"translate(0 0)\"><rect width=\"1440\" height=\"1740\" rx=\"0\" fill=\"#F5F3ED\" stroke=\"none\" stroke-width=\"0\"/><g transform=\"translate(160 24) scale(1.0000 1.0000)\"><g transform=\"translate(0 0)\"><rect width=\"1120\" height=\"60\" rx=\"30.0\" fill=\"#FFFFFF\" stroke=\"#D9D4CA\" stroke-width=\"1\"/><text transform=\"translate(28 17)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"20\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"20\">SETSPACE<\/tspan><\/text><text transform=\"translate(360 20)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">Explore<\/tspan><\/text><g transform=\"translate(426 17)\"><rect width=\"42\" height=\"26\" rx=\"13.0\" fill=\"#ECE9E1\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0 5)\" x=\"21.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"21.0\" y=\"12\">128<\/tspan><\/text><\/g><text transform=\"translate(504 20)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">Journal<\/tspan><\/text><text transform=\"translate(604 20)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">List your space<\/tspan><\/text><text transform=\"translate(748 20)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">About &amp; Help<\/tspan><\/text><text transform=\"translate(908 20)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">Sign in<\/tspan><\/text><g transform=\"translate(988 10)\"><rect width=\"116\" height=\"40\" rx=\"20.0\" fill=\"#B7D36B\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0 10)\" x=\"58.0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"58.0\" y=\"14\">Book<\/tspan><\/text><\/g><\/g><\/g><g transform=\"translate(176 24)\"><\/g><g transform=\"translate(508 24)\"><\/g><g transform=\"translate(654 24)\"><\/g><g transform=\"translate(754 24)\"><\/g><g transform=\"translate(898 24)\"><\/g><g transform=\"translate(1058 24)\"><\/g><g transform=\"translate(1144 24)\"><\/g><g transform=\"translate(220 108)\"><text transform=\"translate(0 6)\" x=\"0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"12\">← Back to Journal · Lighting<\/tspan><\/text><\/g><text transform=\"translate(220 152)\" x=\"0\" font-family=\"&#x27;Bodoni Moda&#x27;, &#x27;Playfair Display&#x27;, Georgia, serif\" font-size=\"42\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"42\">How to light a small studio with one window<\/tspan><\/text><text transform=\"translate(220 214)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"17\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"17\">Before you unpack a single C-stand or plug in a ballast, spend five minutes watching how the window<\/tspan><tspan x=\"0\" y=\"43\">crosses the floor. Natural north light is the largest, softest modifier in the building.<\/tspan><\/text><text transform=\"translate(220 282)\" x=\"0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"12\">By Maya Lin  ·  Published 14 Mar 2026  ·  6 min read  ·  Shot at Lumora Studio (Hackney, E8)<\/tspan><\/text><g transform=\"translate(140 324)\"><defs><clipPath id=\"clip-5cd5fc8b2e\"><rect width=\"1160\" height=\"440\" rx=\"2\"/><\/clipPath><\/defs><rect width=\"1160\" height=\"440\" rx=\"2\" fill=\"#E9DFD3\"/><image href=\"assets/07-lighting-grip-detail.png\" width=\"1160\" height=\"440\" preserveAspectRatio=\"xMidYMid slice\" clip-path=\"url(#clip-5cd5fc8b2e)\"/><\/g><text transform=\"translate(220 776)\" x=\"0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"12\">Fig 01 — A 6×6 textile diffusion frame placed 1.4 metres inside a north-facing Crittall window evens out falloff across the floor.<\/tspan><\/text><text transform=\"translate(220 818)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"17\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"17\">Walk into a daylight studio at ten in the morning and your eye immediately adjusts to the contrast.<\/tspan><tspan x=\"0\" y=\"43\">A camera sensor does not. Close to a 3.4-metre factory window, you might meter f/8 at ISO 200;<\/tspan><tspan x=\"0\" y=\"69\">three metres deeper into the room, inverse-square falloff drops your exposure by two full stops.<\/tspan><tspan x=\"0\" y=\"95\">The mistake most crews make is fighting the window with overpowered strobes instead of shaping the<\/tspan><tspan x=\"0\" y=\"121\">light that is already paying the rent.<\/tspan><\/text><text transform=\"translate(220 944)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"17\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"17\">Start by placing your subject at a 45-degree angle to the glass, roughly two metres back from the<\/tspan><tspan x=\"0\" y=\"43\">frame. At that distance the window acts as a broad, wrap-around key source while the inverse-square<\/tspan><tspan x=\"0\" y=\"69\">curve flattens out enough that your subject can move half a metre without losing exposure. Roll a<\/tspan><tspan x=\"0\" y=\"95\">white 8×4 polyboard onto the shadow side to lift the collarbones by one stop—or flip it to matte<\/tspan><tspan x=\"0\" y=\"121\">black if you want classic editorial cheekbone contrast.<\/tspan><\/text><g transform=\"translate(220 1078)\"><rect width=\"880\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D4CA\" stroke-width=\"1\"/><g transform=\"translate(0 0)\"><rect width=\"6\" height=\"96\" rx=\"0\" fill=\"#B7D36B\" stroke=\"none\" stroke-width=\"0\"/><\/g><text transform=\"translate(28 20)\" x=\"0\" font-family=\"&#x27;Bodoni Moda&#x27;, &#x27;Playfair Display&#x27;, Georgia, serif\" font-size=\"26\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"26\">“Good light doesn’t require a van of grip — just a clear<\/tspan><tspan x=\"0\" y=\"58\">plan and control over what the window gives you.”<\/tspan><\/text><\/g><text transform=\"translate(220 1196)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"17\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"17\">When late afternoon clouds roll across East London and your natural meter drops below f/4, bring in<\/tspan><tspan x=\"0\" y=\"43\">a single Profoto D2 1000 Ws head outside the diffusion frame, aimed along the exact same vector as<\/tspan><tspan x=\"0\" y=\"69\">the window. Because the strobe shares the window’s geometry, the catchlights stay single, natural<\/tspan><tspan x=\"0\" y=\"95\">and architectural.<\/tspan><\/text><g transform=\"translate(220 1308)\"><rect width=\"1000\" height=\"1\" rx=\"0\" fill=\"#D9D4CA\" stroke=\"none\" stroke-width=\"0\"/><\/g><text transform=\"translate(220 1328)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"20\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"20\">Spaces in this story · Book the room where this essay was shot<\/tspan><\/text><g transform=\"translate(220 1368)\"><rect width=\"1000\" height=\"220\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#A39D92\" stroke-width=\"1\"/><g transform=\"translate(20 20)\"><defs><clipPath id=\"clip-ba976f6f04\"><rect width=\"340\" height=\"180\" rx=\"2\"/><\/clipPath><\/defs><rect width=\"340\" height=\"180\" rx=\"2\" fill=\"#E9DFD3\"/><image href=\"assets/01-hero-daylight-cyc.png\" width=\"340\" height=\"180\" preserveAspectRatio=\"xMidYMid slice\" clip-path=\"url(#clip-ba976f6f04)\"/><\/g><g transform=\"translate(388 24)\"><g transform=\"translate(0 0)\"><rect width=\"132\" height=\"30\" rx=\"0\" fill=\"#B7D36B\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(-1.0 7.0)\" x=\"67.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"67.0\" y=\"12\">⚡ Instant book<\/tspan><\/text><\/g><\/g><text transform=\"translate(388 64)\" x=\"0\" font-family=\"&#x27;Bodoni Moda&#x27;, &#x27;Playfair Display&#x27;, Georgia, serif\" font-size=\"42\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"42\">Lumora Studio<\/tspan><\/text><text transform=\"translate(388 114)\" x=\"0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"12\">Hackney, London E8  ·  120 m²  ·  4.2 m ceiling  ·  North Crittall windows + 3× Profoto D2<\/tspan><\/text><text transform=\"translate(388 152)\" x=\"0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">£45 /hr  ·  2 hr minimum  ·  £180 for 4 hrs<\/tspan><\/text><g transform=\"translate(760 142)\"><g transform=\"translate(0 0)\"><rect width=\"212\" height=\"48\" rx=\"0\" fill=\"#B7D36B\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0.0 14.0)\" x=\"106.0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"106.0\" y=\"14\">Book Lumora · £45/hr<\/tspan><\/text><\/g><\/g><\/g><g transform=\"translate(16 16)\"><rect width=\"184\" height=\"36\" rx=\"18.0\" fill=\"#B7D36B\" stroke=\"#191919\" stroke-width=\"1\"/><text transform=\"translate(0 8)\" x=\"92.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"92.0\" y=\"12\">← Prototype menu<\/tspan><\/text><\/g><\/g><\/svg>", "width": 1440, "height": 1740, "hits": [{"x": 176, "y": 24, "width": 170, "height": 60, "target": "flow/home", "label": "nav-hit-home"}, {"x": 508, "y": 24, "width": 132, "height": 60, "target": "flow/explore", "label": "nav-hit-explore"}, {"x": 654, "y": 24, "width": 84, "height": 60, "target": "flow/journal-index", "label": "nav-hit-journal"}, {"x": 754, "y": 24, "width": 132, "height": 60, "target": "flow/host-dashb nsform=\"translate(754 24)\"><\/g><g transform=\"translate(898 24)\"><\/g><g transform=\"translate(1058 24)\"><\/g><g transform=\"translate(1144 24)\"><\/g><g transform=\"translate(80 104)\"><rect width=\"176\" height=\"34\" rx=\"0\" fill=\"#191919\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0 8)\" x=\"88.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#F5F3ED\" text-anchor=\"middle\"><tspan x=\"88.0\" y=\"12\">01 · About Manifesto<\/tspan><\/text><\/g><g transform=\"translate(268 104)\"><rect width=\"150\" height=\"34\" rx=\"0\" fill=\"#ECE9E1\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0 8)\" x=\"75.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"75.0\" y=\"12\">02 · Help &amp; FAQ<\/tspan><\/text><\/g><g transform=\"translate(430 104)\"><rect width=\"176\" height=\"34\" rx=\"0\" fill=\"#ECE9E1\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0 8)\" x=\"88.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"88.0\" y=\"12\">03 · Talk to a person<\/tspan><\/text><\/g><g transform=\"translate(616 104)\"><rect width=\"176\" height=\"34\" rx=\"0\" fill=\"#ECE9E1\" stroke=\"none\" stroke-width=\"0\"/><text transform=\"translate(0 8)\" x=\"88.0\" font-family=\"&#x27;Geist Mono&#x27;, &#x27;JetBrains Mono&#x27;, monospace\" font-size=\"12\" font-weight=\"400\" fill=\"#191919\" text-anchor=\"middle\"><tspan x=\"88.0\" y=\"12\">04 · Sign in / Demo<\/tspan><\/text><\/g><text transform=\"translate(80 160)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"76\" font-weight=\"700\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"76\">Rooms change<\/tspan><tspan x=\"0\" y=\"152\">what gets made.<\/tspan><\/text><text transform=\"translate(80 344)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">01 · The room shapes the work<\/tspan><\/text><text transform=\"translate(80 372)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"15\">Every photograph, record and film carries the room<\/tspan><tspan x=\"0\" y=\"38\">it was made in. A 4.2-metre ceiling changes how a<\/tspan><tspan x=\"0\" y=\"61\">voice decay sounds; north light through steel<\/tspan><tspan x=\"0\" y=\"84\">factory glass changes how skin reads on camera.<\/tspan><\/text><text transform=\"translate(516 344)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">02 · Built on specs, not adjectives<\/tspan><\/text><text transform=\"translate(516 372)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"15\">Most space marketplaces hide the numbers that matter<\/tspan><tspan x=\"0\" y=\"38\">behind “stunning” and “light-filled”. We publish<\/tspan><tspan x=\"0\" y=\"61\">exact floor area, ceiling height, compass<\/tspan><tspan x=\"0\" y=\"84\">orientation, power draw and acoustic RT60 up front.<\/tspan><\/text><text transform=\"translate(952 344)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"14\">03 · Zero double-booked mornings<\/tspan><\/text><text transform=\"translate(952 372)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#6B665E\" text-anchor=\"start\"><tspan x=\"0\" y=\"15\">When a crew of twelve arrives at 08:00 with two vans<\/tspan><tspan x=\"0\" y=\"38\">of grip, a calendar mix-up is a lost shoot day.<\/tspan><tspan x=\"0\" y=\"61\">Every slot on SETSPACE is locked at the PostgreSQL<\/tspan><tspan x=\"0\" y=\"84\">database level the moment checkout begins.<\/tspan><\/text><g transform=\"translate(80 488)\"><defs><clipPath id=\"clip-e0d12d292a\"><rect width=\"1280\" height=\"420\" rx=\"2\"/><\/clipPath><\/defs><rect width=\"1280\" height=\"420\" rx=\"2\" fill=\"#E9DFD3\"/><image href=\"assets/09-empty-plaster-room.png\" width=\"1280\" height=\"420\" preserveAspectRatio=\"xMidYMid slice\" clip-path=\"url(#clip-e0d12d292a)\"/><\/g><g transform=\"translate(80 944)\"><rect width=\"624\" height=\"540\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D4CA\" stroke-width=\"1\"/><text transform=\"translate(32 28)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"34\" font-weight=\"500\" fill=\"#191919\" text-anchor=\"start\"><tspan x=\"0\" y=\"34\">Questions, answered.<\/tspan><\/text><g transform=\"translate(32 84)\"><rect width=\"560\" height=\"48\" rx=\"0\" fill=\"#F5F3ED\" stroke=\"#A39D92\" stroke-width=\"1\"/><g transform=\"translate(16 14) scale(0.8333 0.8333)\"><path d=\"M16 16L21 21 M18 10.5A7.5 7.5 0 1 1 3 10.5A7.5 7.5 0 1 1 18 10.5\" fill=\"none\" stroke=\"#6B665E\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/g><text transform=\"translate(48 14)\" x=\"0\" font-family=\"&#x27;Geist&#x27;, &#x27;Inter&#x27;, -apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#6B665E\" text-ancho let timer;
function go(id){
  if(!DATA[id])return;
  clearTimeout(timer);
  if(location.hash.slice(1)!==id)history.pushState(null,'','#'+id);
  const s=DATA[id];
  document.getElementById('name').textContent=s.name+'  ['+s.width+'×'+s.height+']';
  const stage=document.getElementById('stage');
  stage.style.width=s.width+'px';
  stage.style.height=s.height+'px';
  stage.innerHTML=s.markup;
  for(const h of s.hits){
    const b=document.createElement('button');
    b.setAttribute('aria-label',h.label);
    b.title=h.label+' → '+h.target;
    b.dataset.target=h.target;
    Object.assign(b.style,{left:h.x+'px',top:h.y+'px',width:h.width+'px',height:h.height+'px'});
    b.onclick=()=>go(h.target);
    stage.append(b);
  }
  window.scrollTo({top:0,behavior:'smooth'});
  if(s.timer)timer=setTimeout(()=>go(s.timer.target),s.timer.milliseconds);
}
window.addEventListener('popstate',()=>go(location.hash.slice(1)||'flow/menu'));
